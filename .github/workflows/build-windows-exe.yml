name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "CasinoSfeer" `
            --hidden-import LOL --hidden-import DIEL --hidden-import CHANCEOCHILL `
            --hidden-import SUITZ --hidden-import SUTZ --hidden-import WICE `
            --hidden-import FOUST --hidden-import FANIRAFANA `
            Casino_Sfeer_Menu.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasinoSfeer-windows-exe
          path: dist/CasinoSfeer.exe
